<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" type="text/css" href="/mmrl/insets.css">
<link rel="stylesheet" type="text/css" href="/mmrl/colors.css">
<title>充电分离控制</title>
<style>
    :root { --inset-top: var(--window-inset-top, 0px); --inset-bottom: var(--window-inset-bottom, 0px); }
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #eee; margin: 0; padding: calc(12px + var(--inset-top)) 16px calc(12px + var(--inset-bottom)); }
    .card { background: #262626; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    h1 { font-size: 17px; margin: 0 0 12px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #333; }
    .row:last-child { border-bottom: none; }
    .row.hidden { display: none; }
    .lbl .t { font-size: 15px; font-weight: 600; }
    .lbl .d { font-size: 12px; color: #999; margin-top: 3px; max-width: 210px; }
    .switch { width: 48px; height: 28px; border-radius: 14px; background: #555; position: relative; transition: background .2s; flex-shrink: 0; cursor: pointer; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .switch.on { background: #4caf50; }
    .switch.on::after { transform: translateX(20px); }
    .switch.disabled { opacity: .4; cursor: default; }
    .seg { display: flex; gap: 4px; flex-shrink: 0; }
    .seg button { width: auto; padding: 7px 11px; margin: 0; border-radius: 7px; font-size: 13px; background: #333; color: #ccc; }
    .seg button.active { background: #4caf50; color: #fff; }
    .stepper { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .stepper button { width: 34px; padding: 6px 0; margin: 0; font-size: 16px; }
    .stepper .val { min-width: 46px; text-align: center; font-size: 15px; font-weight: 600; }
    .status { font-size: 13px; color: #888; padding: 6px 0; }
    .status b { color: #eee; }
    button { width: 100%; padding: 11px; border: none; border-radius: 8px; font-size: 14px; background: #333; color: #eee; cursor: pointer; margin-top: 8px; }
    button.primary { background: #4caf50; color: #fff; }
    button:disabled { opacity: .5; }
    .note { font-size: 12px; color: #888; margin-top: 12px; line-height: 1.6; }
    #diag { font-size: 11px; color: #ffb0b0; background: #2a1616; border-radius: 8px; padding: 10px; margin-top: 12px; white-space: pre-wrap; word-break: break-all; display: none; }
</style>
</head>
<body>
    <div id="diag" hidden></div>

    <div class="card">
        <h1>充电分离自动控制</h1>
        <div class="row">
            <div class="lbl"><div class="t">插入电脑 USB 自动分离</div><div class="d">PC 数据口 (SDP/CDP)，插入瞬间动作一次</div></div>
            <div class="switch" id="swUsb"></div>
        </div>
        <div class="row">
            <div class="lbl"><div class="t">充电器模式</div><div class="d" id="modeDesc">关闭：插入充电器不操作</div></div>
            <div class="seg" id="segMode">
                <button data-m="0">关</button>
                <button data-m="1">立即</button>
                <button data-m="2">阈值</button>
            </div>
        </div>
        <div class="row" id="rowThr">
            <div class="lbl"><div class="t">开启阈值</div><div class="d">充到该电量开启分离；0 = 阈值功能不启用</div></div>
            <div class="stepper">
                <button id="thrDown">−</button>
                <span class="val" id="thrVal">70%</span>
                <button id="thrUp">＋</button>
            </div>
        </div>
        <div class="row" id="rowAuto">
            <div class="lbl"><div class="t">低于阈值自动关闭</div><div class="d" id="autoDesc">开：低于阈值关分离、回到阈值再开；关：开启后保持到拔电</div></div>
            <div class="switch" id="swAuto"></div>
        </div>
        <div class="note" id="modeNote">充电器阈值模式每 30 秒检查一次电量；拔电后系统自动关闭分离。</div>
    </div>

    <div class="card">
        <h1>当前状态</h1>
        <div class="status">当前连接：<b id="conn">读取中…</b></div>
        <div class="status">电量：<b id="capVal">读取中…</b></div>
        <div class="status">充电分离开关 (switch)：<b id="swVal">读取中…</b></div>
        <div class="status">硬件节点 (battery_charging_enabled)：<b id="nodeVal">读取中…</b></div>
        <button id="btnApply" class="primary">立即按当前连接应用</button>
        <button id="btnRefresh">刷新状态</button>
    </div>

    <script type="module">
    // SukiSU / MMRL WebUI injects a global `ksu` object (exec/spawn) —
    // NOT the ES module `kernelsu`. ksu.exec is a Java bridge method that
    // depends on `this`, so we must always call it as window.ksu.exec(...).
    const diag = document.getElementById('diag');
    function log(l) { diag.hidden = false; diag.textContent += (diag.textContent ? '\n' : '') + l; }
    window.addEventListener('error', e => log('error: ' + (e.message || e)));
    window.addEventListener('unhandledrejection', e => log('unhandled: ' + ((e.reason && e.reason.message) || e.reason)));

    const ksuObj = typeof window !== 'undefined' && window.ksu ? window.ksu
                : (typeof globalThis !== 'undefined' && globalThis.ksu ? globalThis.ksu : null);
    if (!ksuObj || typeof ksuObj.exec !== 'function') {
        log('FATAL: window.ksu.exec not available');
        throw new Error('no ksu.exec');
    }
    const exec = (cmd) => ksuObj.exec(cmd);   // keeps `this` === ksuObj

    const CONFIG = '/data/adb/modules/zte-charge-separate/config.conf';
    const SETTING = 'charge_separation_switch';
    const USB_ONLINE = '/sys/class/power_supply/usb/online';
    const CHG_TYPE = '/sys/class/power_supply/charger_psy/usb_type';
    const GADGET = '/sys/class/android_usb/android0/state';
    const NODE = '/sys/devices/platform/charger-manager/zte_power_supply/zte_battery/battery_charging_enabled';
    const CAPACITY = '/sys/class/power_supply/battery/capacity';

    const THR_STEPS = [0, 50, 60, 70, 80, 90];
    const MODE_DESC = {
        0: '关闭：插入充电器不操作',
        1: '立即：插入充电器马上开启分离',
        2: '阈值：充到设定电量后开启分离'
    };

    const t = (k) => document.getElementById(k);

    function setSwitchUI(el, on) {
        el.classList.toggle('on', !!on);
    }

    async function readConfig() {
        const { stdout } = await exec('cat ' + CONFIG);
        const cfg = { usb: 1, mode: 0, thr: 70, auto: 0 };
        for (const line of String(stdout || '').split('\n')) {
            const m = line.match(/^\s*(SEP_ON_USB|CHARGER_MODE|THRESHOLD|AUTO_CLOSE)\s*=\s*(-?\d+)/);
            if (!m) continue;
            const v = +m[2];
            if (m[1] === 'SEP_ON_USB') cfg.usb = v ? 1 : 0;
            else if (m[1] === 'CHARGER_MODE') cfg.mode = [0, 1, 2].includes(v) ? v : 0;
            else if (m[1] === 'THRESHOLD') cfg.thr = THR_STEPS.includes(v) ? v : 70;
            else cfg.auto = v ? 1 : 0;
        }
        return cfg;
    }

    async function writeConfig(cfg) {
        // All values are small integers — safe to embed in a single-quoted printf.
        const body =
            '# 充电分离配置（KernelSU 模块页 WebUI 可视化调整）\n' +
            '# 0=关闭 1=开启\n' +
            'SEP_ON_USB=' + cfg.usb + '\n' +
            '# 充电器模式：0=关闭  1=插入立即分离  2=电量阈值模式\n' +
            'CHARGER_MODE=' + cfg.mode + '\n' +
            '# 电量阈值（仅 CHARGER_MODE=2 生效）：0=不启用  可选 50/60/70/80/90\n' +
            'THRESHOLD=' + cfg.thr + '\n' +
            '# 低于阈值自动关闭充电分离（仅 CHARGER_MODE=2 且 THRESHOLD>0 生效）\n' +
            '# 0=达到阈值开启后保持（闩锁，直到拔电）  1=低于阈值自动关闭、回到阈值再次开启\n' +
            'AUTO_CLOSE=' + cfg.auto + '\n';
        const esc = (s) => s.replace(/'/g, "'\\''");
        await exec("printf '%s' '" + esc(body) + "' > " + CONFIG);
        const { stdout } = await exec('cat ' + CONFIG);
        return stdout;
    }

    async function detectConn() {
        const { stdout } = await exec('cat ' + USB_ONLINE);
        if (String(stdout).trim() !== '1') return 'OFF';
        const cur = await exec('cat ' + CHG_TYPE);
        const mm = String(cur.stdout || cur).match(/\[([A-Za-z0-9_]+)\]/);
        const ty = mm ? mm[1] : '';
        if (ty === 'SDP' || ty === 'CDP') return 'PC';
        if (/^(DCP|PD|PD_DRP|BrickID|C)$/.test(ty)) return 'CHARGER';
        const gg = await exec('cat ' + GADGET);
        return String(gg.stdout || gg).trim() === 'CONFIGURED' ? 'PC' : 'CHARGER';
    }

    async function readCapacity() {
        try {
            const { stdout } = await exec('cat ' + CAPACITY);
            const v = parseInt(stdout, 10);
            return Number.isNaN(v) ? null : v;
        } catch { return null; }
    }

    // Mirror of common.sh apply_once/threshold_tick for the current instant.
    // Returns desired (0/1/'keep') — 'keep' = leave switch untouched.
    async function applyOnce() {
        const cfg = await readConfig();
        const conn = await detectConn();
        let desired = 0;
        if (conn === 'OFF') {
            desired = 0;
        } else if (conn === 'PC') {
            desired = cfg.usb;
        } else if (cfg.mode === 1) {
            desired = 1;
        } else if (cfg.mode === 2 && cfg.thr !== 0) {
            const cap = await readCapacity();
            if (cap === null) return { conn, desired: 'keep' };
            if (cap >= cfg.thr) desired = 1;
            else if (cfg.auto === 1) desired = 0;
            else return { conn, desired: 'keep' };  // latch unknown in UI process
        } else {
            desired = 0;
        }
        await exec('settings put global ' + SETTING + ' ' + desired);
        return { conn, desired };
    }

    function renderConfig(cfg) {
        setSwitchUI(t('swUsb'), cfg.usb === 1);
        t('modeDesc').textContent = MODE_DESC[cfg.mode];
        for (const b of t('segMode').querySelectorAll('button'))
            b.classList.toggle('active', +b.dataset.m === cfg.mode);
        const showThr = cfg.mode === 2;
        const showAuto = cfg.mode === 2 && cfg.thr !== 0;
        t('rowThr').classList.toggle('hidden', !showThr);
        t('rowAuto').classList.toggle('hidden', !showAuto);
        t('thrVal').textContent = cfg.thr === 0 ? '关' : cfg.thr + '%';
        setSwitchUI(t('swAuto'), cfg.auto === 1);
    }

    async function refreshStatus() {
        const [conn, cfg, cap] = await Promise.all([detectConn(), readConfig(), readCapacity()]);
        t('conn').textContent = conn;
        t('capVal').textContent = cap === null ? '?' : cap + '%';
        renderConfig(cfg);
        try {
            const { stdout } = await exec('settings get global ' + SETTING);
            t('swVal').textContent = String(stdout).trim();
        } catch { t('swVal').textContent = '?'; }
        try {
            const { stdout } = await exec('cat ' + NODE);
            t('nodeVal').textContent = String(stdout).trim();
        } catch { t('nodeVal').textContent = '?'; }
        return cfg;
    }

    async function mutate(fn) {
        const cfg = await readConfig();
        fn(cfg);
        await writeConfig(cfg);
        await refreshStatus();
    }

    t('swUsb').addEventListener('click', () => mutate(cfg => { cfg.usb = cfg.usb ? 0 : 1; }));
    t('swAuto').addEventListener('click', () => mutate(cfg => { cfg.auto = cfg.auto ? 0 : 1; }));
    for (const b of t('segMode').querySelectorAll('button'))
        b.addEventListener('click', () => mutate(cfg => { cfg.mode = +b.dataset.m; }));

    function stepThreshold(dir) {
        return () => mutate(cfg => {
            const i = THR_STEPS.indexOf(cfg.thr);
            const ni = Math.min(THR_STEPS.length - 1, Math.max(0, (i < 0 ? 2 : i) + dir));
            cfg.thr = THR_STEPS[ni];
        });
    }
    t('thrUp').addEventListener('click', stepThreshold(1));
    t('thrDown').addEventListener('click', stepThreshold(-1));

    t('btnApply').addEventListener('click', async () => {
        t('btnApply').disabled = true;
        const { conn, desired } = await applyOnce();
        t('conn').textContent = conn;
        t('btnApply').textContent = desired === 'keep'
            ? '已应用 (conn=' + conn + ', switch=保持不变)'
            : '已应用 (conn=' + conn + ', switch=' + desired + ')';
        await refreshStatus();
        setTimeout(() => { t('btnApply').disabled = false; t('btnApply').textContent = '立即按当前连接应用'; }, 1500);
    });
    t('btnRefresh').addEventListener('click', refreshStatus);

    refreshStatus();
    </script>
</body>
</html>
