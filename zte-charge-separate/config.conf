# 充电分离配置（KernelSU 模块页 WebUI 可视化调整）
# 0=关闭 1=开启
SEP_ON_USB=1
# 充电器模式：0=关闭  1=插入立即分离  2=电量阈值模式
CHARGER_MODE=0
# 电量阈值（仅 CHARGER_MODE=2 生效）：0=不启用  可选 50/60/70/80/90
THRESHOLD=70
# 低于阈值自动关闭充电分离（仅 CHARGER_MODE=2 且 THRESHOLD>0 生效）
# 0=达到阈值开启后保持（闩锁，直到拔电）  1=低于阈值自动关闭、回到阈值再次开启
AUTO_CLOSE=0
# 满电保护：1=电量到 100% 时无论充电器还是电脑均开启充电分离（最高优先级）
FULL_SEP=0
# 满电后掉电是否关闭分离（仅 FULL_SEP=1 生效）
# 0=开启后保持到拔电  1=掉电（离开 100%）后自动关闭分离恢复充电、再次满电重新开启
FULL_DROP_CLOSE=0
