<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZTE Firewall Cleanup</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 16px; background: #0f1115; color: #e6e6e6;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #8b90a0; font-size: 12px; margin-bottom: 12px; }
  .log {
    background: #161a22; border: 1px solid #262b36; border-radius: 8px;
    padding: 12px; font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px; white-space: pre-wrap; word-break: break-all;
    min-height: 96px; margin: 0 0 12px;
  }
  .bar { display: flex; gap: 8px; }
  button {
    flex: 1; padding: 10px; border: 0; border-radius: 8px;
    background: #2b6cf6; color: #fff; font-size: 14px; cursor: pointer;
  }
  button.ghost { background: #262b36; }
  button:active { opacity: .8; }
</style>
</head>
<body>
<h1>ZTE Firewall Cleanup</h1>
<div class="sub">模块 ID：zte_fw_cleanup · 结果日志：webroot/result.log</div>
<pre class="log" id="log">加载中…</pre>
<div class="bar">
  <button id="run" class="ghost">立即执行</button>
  <button id="refresh">刷新</button>
</div>
<script>
  const moduleDir = '/data/adb/modules/zte_fw_cleanup';
  const logEl = document.getElementById('log');

  function show(text) { logEl.textContent = text; }

  // --- SukiSU（SukiSU-Ultra）桥接适配 ---
  // 同名 exec 只暴露参数最多的重载 exec(cmd, options, callbackFunc)：
  //   用 root shell 执行 cmd 字符串，再经 loadUrl 调用全局回调 (code, stdout, stderr)。
  // 1 参同步版 exec、ksu.readFile、以及 webroot 静态文件 fetch 在本环境均不可用，
  // 因此读取/执行一律走 exec 字符串命令 + 全局回调。
  let __seq = 0;
  function ksuExec(cmd) {
    if (!window.ksu || !window.ksu.exec) {
      return Promise.reject(new Error('当前环境不支持 ksu.exec'));
    }
    return new Promise((resolve, reject) => {
      const name = '__cb' + (__seq++);
      window[name] = (code, stdout, stderr) => {
        delete window[name];
        resolve({ code, stdout: stdout || '', stderr: stderr || '' });
      };
      try {
        window.ksu.exec(cmd, null, 'window.' + name);
      } catch (e) {
        delete window[name];
        reject(e);
      }
    });
  }

  async function loadLog() {
    show('加载中…');
    try {
      const r = await ksuExec('cat ' + moduleDir + '/webroot/result.log');
      const text = (r.stdout || '').trim();
      show(text || '（暂无记录：模块启动后尚未执行，或 zte_fw_gms 链在该网络命名空间不存在）');
    } catch (e) {
      show('读取失败：' + (e && e.message ? e.message : e));
    }
  }

  async function runNow() {
    show('执行中…');
    try {
      await ksuExec('/system/bin/sh ' + moduleDir + '/run.sh');
    } catch (e) {
      show('执行失败：' + (e && e.message ? e.message : e));
      return;
    }
    loadLog();
  }

  document.getElementById('refresh').addEventListener('click', loadLog);
  document.getElementById('run').addEventListener('click', runNow);
  loadLog();
</script>
</body>
</html>
